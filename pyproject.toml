[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woodshed"
version = "0.1.0"
description = "Private practice room: import a song, fix the chart, play along on drums, keys or voice"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy>=1.11",
  "soundfile>=0.12",
  "mido>=1.3",
  "librosa==0.11.0",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "demucs==4.0.1",
  "beat-this==1.1.0",
  "soxr>=0.5",
  "einops>=0.8",
  "rotary-embedding-torch>=0.8",
  "pretty_midi>=0.2.10",
  "adtof-pytorch @ git+https://github.com/xavriley/ADTOF-pytorch@85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9",
  "yt-dlp",
  "faster-whisper>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = ["pytest", "mir_eval"]

[project.scripts]
woodshed = "woodshed.cli:main"

[tool.setuptools]
packages = ["woodshed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
